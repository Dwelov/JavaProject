# Database (use env vars; defaults provided)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/expense_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${SERVER_PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:change_me}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.com.expensetracker=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Disable devtools restart to avoid classloader issues during programmatic restarts
spring.devtools.restart.enabled=false
