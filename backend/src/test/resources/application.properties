# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/Expense App
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=expenseServer123$$$

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Disable logging noise
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate=ERROR
logging.level.root=WARN
logging.level.com.expensetracker=INFO

# Disable DevTools
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# JWT
jwt.secret=TEST_SECRET_KEY_1234567890
jwt.expiration=86400000